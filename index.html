<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOTIMETOPLAY</title>
    
    <!-- Open Graph Metadata -->
    <meta property="og:title" content="NOTIMETOPLAY">
    <meta property="og:description" content="สตรีมเมอร์หน้าเก่า ไม่มีเวลาจะเล่นตามชื่อช่อง">
    <meta property="og:image" content="https://cdn.discordapp.com/attachments/1476854540665098361/1538204897323913316/D1DDD0E1-1B70-401B-B2EE-56470A0AE16F.gif?ex=6a81d471&is=6a8082f1&hm=87822ce235e5968b3000df95b59023d943b9c54dab45006c16a26ac0bba38a29&">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Font (Kanit) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Kanit', sans-serif;
        }

        body {
            background-color: #090d16;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            position: relative;
            overflow-x: hidden;
        }

        /* พื้นหลังเคลื่อนไหวแบบ Gamer Light Glow */
        body::before, body::after {
            content: '';
            position: absolute;
            width: 350px;
            height: 350px;
            border-radius: 50%;
            filter: blur(90px);
            z-index: -1;
            opacity: 0.5;
            animation: pulse-glow 8s infinite alternate ease-in-out;
        }

        body::before {
            background: #38bdf8;
            top: -50px;
            left: -50px;
        }

        body::after {
            background: #9146ff;
            bottom: -50px;
            right: -50px;
            animation-delay: -4s;
        }

        @keyframes pulse-glow {
            0% { transform: scale(1) translate(0, 0); opacity: 0.4; }
            100% { transform: scale(1.3) translate(30px, -30px); opacity: 0.7; }
        }

        /* ตัวการ์ดแบบ Glassmorphism */
        .card {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 28px;
            padding: 44px 28px;
            width: 100%;
            max-width: 440px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7),
                        0 0 30px rgba(56, 189, 248, 0.15);
            transition: transform 0.3s ease;
        }

        /* รูป Avatar พร้อมขอบแสงหมุน */
        .avatar-wrapper {
            position: relative;
            width: 130px;
            height: 130px;
            margin: 0 auto 24px;
        }

        .avatar-wrapper::before {
            content: '';
            position: absolute;
            top: -4px; left: -4px; right: -4px; bottom: -4px;
            background: linear-gradient(45deg, #38bdf8, #9146ff, #10b981, #38bdf8);
            border-radius: 50%;
            z-index: 0;
            background-size: 300%;
            animation: border-rotate 6s linear infinite;
        }

        @keyframes border-rotate {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .avatar {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #0f172a;
        }

        .status-badge {
            position: absolute;
            bottom: 6px;
            right: 6px;
            background: #22c55e;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 3px solid #0f172a;
            z-index: 2;
            box-shadow: 0 0 10px #22c55e;
        }

        h1 {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: #ffffff;
            margin-bottom: 4px;
            background: linear-gradient(to right, #ffffff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .tagline {
            color: #38bdf8;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }

        .bio {
            color: #cbd5e1;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 30px;
            background: rgba(30, 41, 59, 0.4);
            padding: 14px 18px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* Styling ปุ่มทั่วไป */
        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px 24px;
            background: rgba(30, 41, 59, 0.7);
            color: #ffffff;
            text-decoration: none;
            border-radius: 16px;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
            overflow: hidden;
        }

        .link-btn i {
            font-size: 1.3rem;
            transition: transform 0.3s ease;
        }

        .link-btn:hover {
            transform: translateY(-3px) scale(1.02);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .link-btn:hover i {
            transform: scale(1.2);
        }

        /* Hover สี นีออน ตามแบรนด์ */
        .link-btn.donate:hover {
            background: #10b981;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.6);
        }

        .link-btn.youtube:hover {
            background: #ff0000;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.6);
        }

        .link-btn.twitch:hover {
            background: #9146ff;
            box-shadow: 0 0 20px rgba(145, 70, 255, 0.6);
        }

        .link-btn.discord:hover {
            background: #5865f2;
            box-shadow: 0 0 20px rgba(88, 101, 242, 0.6);
        }

        .link-btn.tiktok:hover {
            background: #000000;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
            border-color: #ff0050;
        }

        footer {
            margin-top: 32px;
            color: #64748b;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- รูป Avatar GIF -->
        <div class="avatar-wrapper">
            <img class="avatar" src="https://cdn.discordapp.com/attachments/1476854540665098361/1538204897323913316/D1DDD0E1-1B70-401B-B2EE-56470A0AE16F.gif?ex=6a81d471&is=6a8082f1&hm=87822ce235e5968b3000df95b59023d943b9c54dab45006c16a26ac0bba38a29&" alt="NOTIMETOPLAY Avatar">
            <div class="status-badge" title="Offline / ไม่มีเวลาเล่น"></div>
        </div>

        <!-- ชื่อช่อง -->
        <h1>NOTIMETOPLAY</h1>
        <div class="tagline">Streamer</div>

        <!-- ประวัติ -->
        <p class="bio">
            สตรีมเมอร์หน้าเก่า ไม่มีเวลาจะเล่นตามชื่อช่อง 🎮⌛
        </p>

        <!-- ปุ่ม Links -->
        <div class="links">
            <a href="https://ihavenotimez.hpdn.app" target="_blank" class="link-btn donate">
                <i class="fa-solid fa-heart"></i> Donate / สนับสนุน
            </a>
            <a href="https://www.youtube.com/@Ihavenotimez" target="_blank" class="link-btn youtube">
                <i class="fa-brands fa-youtube"></i> YouTube
            </a>
            <a href="https://www.twitch.tv/ihavenotimez" target="_blank" class="link-btn twitch">
                <i class="fa-brands fa-twitch"></i> Twitch
            </a>
            <a href="https://discord.gg/NPgZHbpH3Z" target="_blank" class="link-btn discord">
                <i class="fa-brands fa-discord"></i> Discord Community
            </a>
            <a href="https://www.tiktok.com/@inotbulan?is_from_webapp=1&sender_device=pc" target="_blank" class="link-btn tiktok">
                <i class="fa-brands fa-tiktok"></i> TikTok
            </a>
        </div>

        <footer>
            © NOTIMETOPLAY - สตรีมเมอร์ในดวงใจ
        </footer>
    </div>

</body>
</html>
