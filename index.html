<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOTIMETOPLAY</title>
    
    <!-- Open Graph Metadata สำหรับแชร์ลง Social Media -->
    <meta property="og:title" content="NOTIMETOPLAY">
    <meta property="og:description" content="สตรีมเมอร์หน้าเก่า ไม่มีเวลาจะเล่นตามชื่อช่อง">
    <meta property="og:image" content="https://cdn.discordapp.com/attachments/1476854540665098361/1538204897323913316/D1DDD0E1-1B70-401B-B2EE-56470A0AE16F.gif?ex=6a81d471&is=6a8082f1&hm=87822ce235e5968b3000df95b59023d943b9c54dab45006c16a26ac0bba38a29&">
    
    <!-- Font Awesome สำหรับไอคอน Social Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Font (Kanit) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Kanit', sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px 24px;
            width: 100%;
            max-width: 480px;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
        }

        .avatar-wrapper {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #38bdf8;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
        }

        .status-badge {
            position: absolute;
            bottom: 4px;
            right: 4px;
            background: #22c55e;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 3px solid #1e293b;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: #ffffff;
            margin-bottom: 8px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .tagline {
            color: #38bdf8;
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .bio {
            color: #94a3b8;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 30px;
            background: rgba(15, 23, 42, 0.5);
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 14px 20px;
            background: #334155;
            color: #ffffff;
            text-decoration: none;
            border-radius: 14px;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .link-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        /* Styling ช่องทาง Social & Donate */
        .link-btn.donate:hover { background: #10b981; }
        .link-btn.youtube:hover { background: #ff0000; }
        .link-btn.twitch:hover { background: #9146ff; }
        .link-btn.discord:hover { background: #5865f2; }
        .link-btn.tiktok:hover { background: #000000; }

        .link-btn i {
            font-size: 1.2rem;
        }

        footer {
            margin-top: 30px;
            color: #64748b;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- รูป Avatar GIF -->
        <div class="avatar-wrapper">
            <img class="avatar" src="https://cdn.discordapp.com/attachments/1476854540665098361/1538204897323913316/D1DDD0E1-1B70-401B-B2EE-56470A0AE16F.gif?ex=6a81d471&is=6a8082f1&hm=87822ce235e5968b3000df95b59023d943b9c54dab45006c16a26ac0bba38a29&" alt="NOTIMETOPLAY Avatar">
            <div class="status-badge" title="Offline / ไม่มีเวลาเล่น"></div>
        </div>

        <!-- ชื่อช่อง -->
        <h1>NOTIMETOPLAY</h1>
        <div class="tagline">Streamer</div>

        <!-- ประวัติ -->
        <p class="bio">
            สตรีมเมอร์หน้าเก่า ไม่มีเวลาจะเล่นตามชื่อช่อง 🎮⌛
        </p>

        <!-- ปุ่ม Links -->
        <div class="links">
            <!-- ปุ่มโดเนท (ใส่ URL ลิงก์โดเนทจริงของคุณแทนที่ # ได้เลย) -->
            <a href="https://tipme.in.th" target="_blank" class="link-btn donate">
                <i class="fa-solid fa-heart"></i> Donate / สนับสนุน
            </a>
            <a href="https://youtube.com" target="_blank" class="link-btn youtube">
                <i class="fa-brands fa-youtube"></i> YouTube
            </a>
            <a href="https://twitch.tv" target="_blank" class="link-btn twitch">
                <i class="fa-brands fa-twitch"></i> Twitch
            </a>
            <a href="https://discord.gg" target="_blank" class="link-btn discord">
                <i class="fa-brands fa-discord"></i> Discord Community
            </a>
            <a href="https://tiktok.com" target="_blank" class="link-btn tiktok">
                <i class="fa-brands fa-tiktok"></i> TikTok
            </a>
        </div>

        <footer>
            © NOTIMETOPLAY - Hosted on GitHub Pages
        </footer>
    </div>

</body>
</html>
